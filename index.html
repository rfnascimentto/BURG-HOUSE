let cart = [];

let selectedProduct = null;

let modalQuantity = 1;


/* ============================================================
   UTILITÁRIOS
   ============================================================ */

function formatPrice(value) {
    return value.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function categoryName(category) {
    const names = {
        hamburgueres: "🍔 HAMBÚRGUERES",
        combos: "🍟 COMBOS",
        porcoes: "🍟 PORÇÕES",
        bebidas: "🥤 BEBIDAS"
    };

    return names[category] || category;
}


/* ============================================================
   RENDERIZAÇÃO DOS PRODUTOS
   ============================================================ */

function renderProducts(category = "todos") {

    const container = document.getElementById("products-container");

    container.innerHTML = "";

    const filteredProducts =
        category === "todos"
            ? products
            : products.filter(product => product.category === category);

    const categories = [
        "hamburgueres",
        "combos",
        "porcoes",
        "bebidas"
    ];

    categories.forEach(currentCategory => {

        const categoryProducts = filteredProducts.filter(
            product => product.category === currentCategory
        );

        if (categoryProducts.length === 0) {
            return;
        }

        const section = document.createElement("section");

        section.innerHTML = `
            <h2 class="category-title">
                ${categoryName(currentCategory)}
            </h2>

            <div class="products-grid">
                ${categoryProducts.map(productCard).join("")}
            </div>
        `;

        container.appendChild(section);
    });
}


function productCard(product) {

    const description = product.description
        ? `<p class="product-description">${escapeHTML(product.description)}</p>`
        : `<p class="product-description">&nbsp;</p>`;

    return `
        <article class="product-card">

            <div class="product-image">
                <img
                    src="${escapeHTML(product.image)}"
                    alt="${escapeHTML(product.name)}"
                    onerror="this.style.display='none'; this.parentElement.innerHTML='🍔 Imagem do produto';"
                >
            </div>

            <div class="product-content">

                <h3>${escapeHTML(product.name)}</h3>

                ${description}

                <div class="product-bottom">

                    <span class="price">
                        ${formatPrice(product.price)}
                    </span>

                    <button
                        class="add-btn"
                        onclick="openProductModal(${product.id})"
                    >
                        Adicionar
                    </button>

                </div>

            </div>

        </article>
    `;
}

            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        renderProducts(button.dataset.category);
    });
});


/* ============================================================
   MODAL DO PRODUTO
   ============================================================ */

function openProductModal(productId) {

    selectedProduct = products.find(
        product => product.id === productId
    );

    if (!selectedProduct) return;

    modalQuantity = 1;

    document.getElementById("modal-product-name").textContent =
        selectedProduct.name;

    document.getElementById("modal-product-price").textContent =
        formatPrice(selectedProduct.price);

    document.getElementById("modal-quantity").textContent =
        modalQuantity;

    document.getElementById("modal-observation").value = "";

    document.getElementById("flavor-select").value = "";

    /* Adicionais */
    const extrasSection = document.getElementById("hamburger-extras");

    if (selectedProduct.category === "hamburgueres") {

        extrasSection.classList.remove("hidden");

        document.getElementById("extras-container").innerHTML =
            extras.map(extra => `
                <div class="extra-option">

                    <label>
                        <input
                            type="checkbox"
                            value="${escapeHTML(extra.id)}"
                            data-name="${escapeHTML(extra.name)}"
                            data-price="${extra.price}"
                        >
                        ${escapeHTML(extra.name)}
                    </label>

                    <span class="extra-price">
                        + ${formatPrice(extra.price)}
                    </span>

                </div>
            `).join("");

    } else {

        extrasSection.classList.add("hidden");

        document.getElementById("extras-container").innerHTML = "";
    }


    /* Milk-shake */
    const flavorSection = document.getElementById("milkshake-flavor");

    if (selectedProduct.name === "Milk-shake") {
        flavorSection.classList.remove("hidden");
    } else {
        flavorSection.classList.add("hidden");
    }


    document.getElementById("product-modal")
        .classList.add("show");
}


function closeProductModal() {

    document.getElementById("product-modal")
        .classList.remove("show");

    selectedProduct = null;
}


function changeModalQuantity(amount) {

    modalQuantity += amount;

    if (modalQuantity < 1) {
        modalQuantity = 1;
    }

    document.getElementById("modal-quantity").textContent =
        modalQuantity;
}


/* ============================================================
   ADICIONAR PRODUTO CONFIGURADO AO CARRINHO
   ============================================================ */

function addConfiguredProduct() {

    if (!selectedProduct) return;


    /* Verifica sabor do Milk-shake */

    let flavor = "";

    if (selectedProduct.name === "Milk-shake") {

        flavor = document.getElementById("flavor-select").value;

        if (!flavor) {
            alert("Selecione o sabor do Milk-shake.");
            return;
        }
    }


    /* Adicionais */

    let selectedExtras = [];

    if (selectedProduct.category === "hamburgueres") {

        document
            .querySelectorAll("#extras-container input:checked")
            .forEach(input => {

                selectedExtras.push({
                    id: input.value,
                    name: input.dataset.name,
                    price: Number(input.dataset.price)
                });

            });
    }


    const observation =
        document.getElementById("modal-observation").value.trim();


    /* Preço unitário */

    const extrasTotal = selectedExtras.reduce(
        (sum, extra) => sum + extra.price,
        0
    );

    const unitPrice =
        selectedProduct.price + extrasTotal;


    /* Item */

    const cartItem = {

        cartId:
            Date.now() +
            Math.random().toString(36).substring(2),

        productId: selectedProduct.id,

        name: selectedProduct.name,

        basePrice: selectedProduct.price,

        unitPrice: unitPrice,

        quantity: modalQuantity,

        flavor: flavor,

        extras: selectedExtras,

        observation: observation
    };


    cart.push(cartItem);

    updateCartCount();

    closeProductModal();

    alert("Produto adicionado ao carrinho!");
}


/* ============================================================
   CARRINHO
   ============================================================ */

function updateCartCount() {

    const count = cart.reduce(
        (total, item) => total + item.quantity,
        0
    );

    document.getElementById("cart-count").textContent = count;
}


function openCart() {

    updateCart();

    document
        .getElementById("cart-modal")
        .classList.add("show");
}


function closeCart() {

    document
        .getElementById("cart-modal")
        .classList.remove("show");
}


function calculateSubtotal() {

    return cart.reduce(
        (total, item) =>
            total + (item.unitPrice * item.quantity),
        0
    );
}


function getCouponDiscount() {

    const coupon =
        document
            .getElementById("coupon")
            .value
            .trim()
            .toUpperCase();

    if (!coupon) {
        return 0;
    }

    return config.coupons[coupon] || 0;
}


function updateCart() {

    const container =
        document.getElementById("cart-items");

    if (cart.length === 0) {

        container.innerHTML = `
            <div class="empty-cart">
                Seu carrinho está vazio.
            </div>
        `;

    } else {

        container.innerHTML = cart
            .map(renderCartItem)
            .join("");
    }


    const subtotal = calculateSubtotal();

    const delivery =
        cart.length > 0
            ? config.deliveryFee
            : 0;

    const discount =
        Math.min(getCouponDiscount(), subtotal);

    const total =
        subtotal +
        delivery -
        discount;


    document.getElementById("cart-summary").innerHTML = `

        <div class="summary">

            <div class="summary-row">
                <span>Subtotal</span>
                <strong>${formatPrice(subtotal)}</strong>
            </div>

            <div class="summary-row">
                <span>Entrega</span>
                <strong>${formatPrice(delivery)}</strong>
            </div>

            <div class="summary-row">
                <span>Desconto</span>
                <strong>- ${formatPrice(discount)}</strong>
            </div>

            <div class="summary-row summary-total">
                <span>Total</span>
                <strong>${formatPrice(total)}</strong>
            </div>

        </div>
    `;
}


function renderCartItem(item) {

    const extrasHTML = item.extras.length
        ? `
            <strong>Adicionais:</strong>
            <ul>
                ${item.extras.map(extra =>
                    `<li>${escapeHTML(extra.name)} — ${formatPrice(extra.price)}</li>`
                ).join("")}
            </ul>
        `
        : "";


    const flavorHTML = item.flavor
        ? `<div><strong>Sabor:</strong> ${escapeHTML(item.flavor)}</div>`
        : "";


    const observationHTML = item.observation
        ? `<div><strong>Observação:</strong> ${escapeHTML(item.observation)}</div>`
        : "";


    const subtotalItem =
        item.unitPrice * item.quantity;


    return `

        <div class="cart-item">

            <div class="cart-item-header">

                <div class="cart-item-name">
                    ${escapeHTML(item.name)}
                </div>

                <div class="cart-item-price">
                    ${formatPrice(subtotalItem)}
                </div>

            </div>

            <div class="cart-details">

                <div>
                    ${item.quantity}x —
                    ${formatPrice(item.unitPrice)}
                </div>

                ${flavorHTML}

                ${extrasHTML}

                ${observationHTML}

                <div style="margin-top:8px;">
                    <strong>Subtotal do item:</strong>
                    ${formatPrice(subtotalItem)}
                </div>

            </div>

            <div class="cart-actions">

                <button onclick="changeCartQuantity('${item.cartId}', -1)">
                    −
                </button>

                <strong>${item.quantity}</strong>

                <button onclick="changeCartQuantity('${item.cartId}', 1)">
                    +
                </button>

                <button
                    class="remove-btn"
                    onclick="removeCartItem('${item.cartId}')"
                >
                    Remover
                </button>

            </div>

        </div>
    `;
}


function changeCartQuantity(cartId, amount) {

    const item = cart.find(
        item => item.cartId === cartId
    );

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
        cart = cart.filter(
            item => item.cartId !== cartId
        );
    }

    updateCartCount();

    updateCart();
}


function removeCartItem(cartId) {

    cart = cart.filter(
        item => item.cartId !== cartId
    );

    updateCartCount();

    updateCart();
}


/* ============================================================
   WHATSAPP
   ============================================================ */

function sendWhatsAppOrder() {

    if (cart.length === 0) {
        alert("Adicione produtos ao carrinho antes de finalizar.");
        return;
    }


    const name =
        document.getElementById("customer-name")
            .value.trim();

    const address =
        document.getElementById("customer-address")
            .value.trim();

    const neighborhood =
        document.getElementById("customer-neighborhood")
            .value.trim();

    const complement =
        document.getElementById("customer-complement")
            .value.trim();

    const reference =
        document.getElementById("customer-reference")
            .value.trim();

    const payment =
        document.getElementById("payment-method")
            .value;


    if (!name || !address || !neighborhood) {

        alert(
            "Preencha pelo menos Nome, Endereço e Bairro."
        );

        return;
    }


    const subtotal = calculateSubtotal();

    const delivery = config.deliveryFee;

    const discount =
        Math.min(getCouponDiscount(), subtotal);

    const total =
        subtotal +
        delivery -
        discount;


    let message =
`🍔 *BURG HOUSE — NOVO PEDIDO*

👤 Cliente: ${name}

📦 *ITENS DO PEDIDO*

`;


    cart.forEach(item => {

        message +=
`${item.quantity}x ${item.name}`;

        if (item.flavor) {
            message += ` — ${item.flavor}`;
        }

        message +=
` — ${formatPrice(item.unitPrice * item.quantity)}
`;


        item.extras.forEach(extra => {

            message +=
`- ${extra.name} — ${formatPrice(extra.price * item.quantity)}
`;

        });


        if (item.observation) {

            message +=
`  Obs.: ${item.observation}
`;
        }


        message += "\n";
    });


    message +=
`💰 Subtotal: ${formatPrice(subtotal)}
🚚 Entrega: ${formatPrice(delivery)}
💸 Desconto: ${formatPrice(discount)}
💵 *Total: ${formatPrice(total)}*

📍 *ENTREGA*

${address}
Bairro ${neighborhood}
Complemento: ${complement || "Não informado"}
Referência: ${reference || "Não informada"}

💳 *PAGAMENTO*
${payment}`;


    const encodedMessage =
        encodeURIComponent(message);

    const whatsappURL =
        `https://wa.me/${config.whatsapp}?text=${encodedMessage}`;


    window.open(
        whatsappURL,
        "_blank"
    );
}


/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */

renderProducts();

updateCartCount();

</script>
